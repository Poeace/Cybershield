{% extends 'base.html' %}
{% block title %}Admin Login - CyberShield{% endblock %}
{% block content %}
<section class="py-4" data-aos="fade-up">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="cyber-card p-4">
        <h3 class="fw-bold mb-3"><i class="fa-solid fa-user-shield me-2" style="color:var(--neon)"></i> Admin Login</h3>

        <form method="post" action="{{ url_for('admin.admin_login') }}">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input class="form-control" name="username" required maxlength="80" />
          </div>
          <div class="mb-4">
            <label class="form-label">Password</label>
            <input class="form-control" type="password" name="password" required minlength="4" />
          </div>

          <div class="mb-3">
            <label class="form-label">Captcha</label>
            <div class="d-flex gap-2 align-items-center">
              <span class="badge bg-dark text-white">{{ captcha_text }}</span>
              <input class="form-control" name="captcha" required maxlength="10" placeholder="Enter captcha" />
            </div>
          </div>

          <button class="btn cyber-btn w-100" type="submit">
            Login <i class="fa-solid fa-lock ms-2"></i>
          </button>
        </form>

        <div class="text-center mt-3 text-muted small">
          Admin credentials are configured via environment variables.
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
