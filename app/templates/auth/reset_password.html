{% extends 'base.html' %}
{% block title %}Reset password - CyberShield{% endblock %}
{% block content %}
<section class="py-4" data-aos="fade-up">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="cyber-card p-4">
        <h3 class="fw-bold mb-3"><i class="fa-solid fa-fingerprint me-2" style="color:var(--neon)"></i> Verify OTP & set new password</h3>

        <form method="post" action="{{ url_for('auth.reset_password') }}">
          <input type="hidden" name="user_id" value="{{ user_id }}" />

          <div class="mb-3">
            <label class="form-label">OTP</label>
            <input class="form-control" name="otp" required maxlength="6" inputmode="numeric" aria-label="OTP" />
          </div>

          <div class="mb-3">
            <label class="form-label">New password</label>
            <input class="form-control" type="password" name="new_password" required minlength="6" />
          </div>

          <div class="mb-4">
            <label class="form-label">Confirm new password</label>
            <input class="form-control" type="password" name="confirm_new_password" required minlength="6" />
          </div>

          <button class="btn cyber-btn w-100" type="submit">
            Update password <i class="fa-solid fa-rotate ms-2"></i>
          </button>

          <div class="text-center mt-3 text-muted small">
            <a href="{{ url_for('auth.login') }}" class="text-decoration-none">Back to login</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
