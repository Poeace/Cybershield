{% extends 'base.html' %}
{% block title %}Forgot password - CyberShield{% endblock %}
{% block content %}
<section class="py-4" data-aos="fade-up">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="cyber-card p-4">
        <h3 class="fw-bold mb-3"><i class="fa-solid fa-key me-2" style="color:var(--neon)"></i> Reset password</h3>

        <form method="post" action="{{ url_for('auth.forgot_password') }}">
          <div class="mb-3">
            <label class="form-label">Username or email</label>
            <input class="form-control" name="username_email" required maxlength="120" aria-label="Username or email" />
          </div>

          <div class="text-muted small mb-3">
            OTP will be sent to your registered email address.
          </div>


          <button class="btn cyber-btn w-100" type="submit">
            Send OTP to email <i class="fa-solid fa-paper-plane ms-2"></i>
          </button>



          <div class="text-center mt-3 text-muted small">
            Remembered your password? <a href="{{ url_for('auth.login') }}" class="text-decoration-none">Back to login</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
