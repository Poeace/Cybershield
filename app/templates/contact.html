{% extends 'base.html' %}
{% block title %}Contact - CyberShield{% endblock %}
{% block content %}
<section class="py-4" data-aos="fade-up">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="cyber-card p-4">
        <h2 class="fw-bold mb-2"><i class="fa-solid fa-envelope me-2" style="color:var(--neon)"></i> Contact Us</h2>
        <p class="text-muted">Send your message and we’ll get back to you.</p>

        <form method="post" action="{{ url_for('auth.contact_submit') }}" class="mt-4">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="contact_name">Name</label>
              <input class="form-control" id="contact_name" name="name" required maxlength="120" aria-label="Your name" />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="contact_email">Email</label>
              <input class="form-control" id="contact_email" type="email" name="email" required maxlength="120" aria-label="Your email" />
            </div>
            <div class="col-12">
              <label class="form-label" for="contact_subject">Subject</label>
              <input class="form-control" id="contact_subject" name="subject" required maxlength="200" aria-label="Subject" />
            </div>
            <div class="col-12">
              <label class="form-label" for="contact_message">Message</label>
              <textarea class="form-control" id="contact_message" name="message" rows="5" required maxlength="5000" aria-label="Your message"></textarea>
            </div>
          </div>

          <button class="btn cyber-btn mt-3 w-100" type="submit" style="min-height:48px;">
            Submit <i class="fa-solid fa-paper-plane ms-2"></i>
          </button>
        </form>

      </div>
    </div>
  </div>
</section>
{% endblock %}
