{% extends 'base.html' %}
{% block title %}Contact - CyberShield{% endblock %}
{% block content %}
<section class="py-4" data-aos="fade-up">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="cyber-card p-4">
        <h2 class="fw-bold mb-2"><i class="fa-solid fa-envelope me-2" style="color:var(--neon)"></i> Contact Us</h2>
        <p class="text-muted">Send your message and we’ll get back to you.</p>

        <form method="post" action="{{ url_for('auth.contact_submit') }}" class="mt-4">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Name</label>
              <input class="form-control" name="name" required maxlength="120" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input class="form-control" type="email" name="email" required maxlength="120" />
            </div>
            <div class="col-12">
              <label class="form-label">Subject</label>
              <input class="form-control" name="subject" required maxlength="200" />
            </div>
            <div class="col-12">
              <label class="form-label">Message</label>
              <textarea class="form-control" name="message" rows="5" required maxlength="5000"></textarea>
            </div>
          </div>

          <button class="btn cyber-btn mt-3" type="submit" style="width:100%">
            Submit <i class="fa-solid fa-paper-plane ms-2"></i>
          </button>
        </form>

      </div>
    </div>
  </div>
</section>
{% endblock %}
